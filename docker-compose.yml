services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8085
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - server
    env_file:
      - ./web/.env
